[project]
name = "demoharness"
version = "0.2.0"
description = "An observable, minimal teaching harness for tool-using agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11,<4",
    "httpx>=0.28.1",
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
demoharness = "demoharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/demoharness"]
