[project]
name = "democlaw"
version = "0.1.0"
description = "A minimal teaching demo for long-running agent tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/democlaw"]
