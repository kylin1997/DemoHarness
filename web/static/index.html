<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DemoClaw 观察面</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f6f7f9; color: #1f2328; }
    header { padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 12px; }
    header .brand { font-weight: 600; }
    .muted { color: #8b949e; font-size: 12px; }
    .wrap { display: flex; height: calc(100vh - 50px); }
    .col { border-right: 1px solid #e5e5e5; background: #fff; }
    .col.left { width: 240px; min-width: 200px; }
    .col.mid { flex: 1; min-width: 0; }
    .col.right { width: 300px; min-width: 240px; border-right: none; }
    .col-head { padding: 10px 14px; border-bottom: 1px solid #eee; font-size: 13px; font-weight: 600; }
    .scroll { overflow-y: auto; height: calc(100% - 38px); }
    /* 顶栏 */
    .bar { display: flex; gap: 8px; padding: 8px 16px; align-items: center; background: #fafbfc; border-bottom: 1px solid #eee; }
    input, textarea { font-size: 13px; font-family: inherit; padding: 6px 10px; border: 1px solid #d0d7de; border-radius: 6px; }
    button { padding: 6px 14px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
    button.primary { background: #2da44e; border-color: #2da44e; color: #fff; }
    .spacer { flex: 1; }
    /* 会话列表 */
    .sess { padding: 9px 14px; border-bottom: 1px solid #f5f5f5; cursor: pointer; font-size: 13px; }
    .sess:hover { background: #f6f8fa; }
    .sess.active { background: #ddf4ff; }
    .tag { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 10px; margin-right: 4px; }
    .tag-running { background: #fff8c5; color: #9a6700; }
    .tag-idle { background: #dafbe1; color: #116329; }
    /* 中栏历史 */
    .entry { padding: 7px 14px; border-bottom: 1px solid #f6f6f6; font-size: 12px; line-height: 1.5; }
    .entry.user { border-left: 3px solid #2f81f7; background: #fbfdff; }
    .entry.assistant { border-left: 3px solid #2da44e; background: #f8fff8; }
    .entry.tool_call, .entry.tool_result { border-left: 3px solid #f0883e; background: #fffaf5; font-family: ui-monospace, Menlo, monospace; }
    .entry.reset, .entry.interrupted { border-left: 3px solid #cf222e; background: #fff8f8; }
    .kind { font-weight: 600; margin-right: 6px; }
    /* 右栏事件流 */
    .evt { padding: 6px 14px; border-bottom: 1px solid #f6f6f6; font-size: 12px; }
    .evt .t { font-weight: 600; }
    .evt.tool .t { color: #f0883e; }
    .evt.phase .t { color: #8250df; }
    .evt.done .t { color: #2da44e; }
    .statline { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #eee; }
    .card { margin: 8px 14px; padding: 10px; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; }
  </style>
</head>
<body>
  <header>
    <span class="brand">DemoClaw 观察面</span>
    <span class="muted">Agent harness 教学演示 · 仪表盘</span>
    <span class="spacer"></span>
    <span class="muted" id="conn">SSE 未连接</span>
  </header>

  <!-- 顶栏：发任务 → 会话历史  -->
  <div class="bar">
    <input id="bot" value="architect" style="width:110px" title="bot 名">
    <input id="task" placeholder="输入任务…" style="flex:1">
    <button class="primary" id="run">运行</button>
    <span class="muted" id="status">就绪</span>
  </div>

  <div class="wrap">
    <!-- 左栏：会话列表 -->
    <div class="col left">
      <div class="col-head">会话</div>
      <div class="scroll" id="sessions"></div>
    </div>

    <!-- 中栏：会话历史 -->
    <div class="col mid">
      <div class="col-head">历史 <span class="muted" id="hist-title"></span></div>
      <div class="scroll" id="history"><div class="muted" style="padding:14px">选择左侧会话查看历史</div></div>
    </div>

    <!-- 右栏：实时事件流 + 任务状态 -->
    <div class="col right">
      <div class="col-head">实时事件流</div>
      <div class="statline" id="taskstat">— 无活动任务 —</div>
      <div class="scroll" id="events"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
